kind = "web"
previewPath = "/"
title = "Django Task Manager"
description = "A server-rendered Django task manager with SQLite persistence and simple task CRUD flows."
version = "1.0.0"
id = "artifacts/task-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 8000

[services.development]
run = "cd ../.. && python manage.py runserver 0.0.0.0:8000"

[services.production]
build = [ "python", "manage.py", "check" ]
run = "python -m gunicorn --bind 0.0.0.0:$PORT task_manager.wsgi:application"

[services.env]
BASE_PATH = "/"
